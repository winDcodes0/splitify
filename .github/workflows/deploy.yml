name: Splitly — Build & Deploy to AWS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: ap-southeast-2
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build & Push Docker Images to ECR
  # ─────────────────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Backend Image
        run: |
          docker build -t $ECR_REGISTRY/splitly/backend:$GITHUB_SHA .
          docker tag $ECR_REGISTRY/splitly/backend:$GITHUB_SHA $ECR_REGISTRY/splitly/backend:latest
          docker push $ECR_REGISTRY/splitly/backend:$GITHUB_SHA
          docker push $ECR_REGISTRY/splitly/backend:latest

      - name: Build, Tag & Push Frontend Image
        run: |
          cd client
          docker build -t $ECR_REGISTRY/splitly/frontend:$GITHUB_SHA .
          docker tag $ECR_REGISTRY/splitly/frontend:$GITHUB_SHA $ECR_REGISTRY/splitly/frontend:latest
          docker push $ECR_REGISTRY/splitly/frontend:$GITHUB_SHA
          docker push $ECR_REGISTRY/splitly/frontend:latest

  # ─────────────────────────────────────────
  # JOB 2: Deploy to EC2 ASG (Instance Refresh)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to EC2 Auto Scaling
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger Auto Scaling Instance Refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name splitly-asg \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 120}'

      - name: Deployment Initiated
        run: echo "✅ Instance refresh initiated. EC2 instances will cycle and pull the new images!"
